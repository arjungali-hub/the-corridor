<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Corridor</title>
  <meta name="description" content="You are the wolf. The map you inherited is wrong.">
  <!-- Wolf favicon: Twemoji 1f43a, (c) Twitter/X contributors, CC-BY 4.0 -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Social / link unfurl. The text tags are final. BEFORE SHARING, replace the
       placeholder domain below with the real deployed URL, and add og-cover.png
       (a 1200x630 representative screenshot) at the site root. og:image MUST be
       an absolute URL — crawlers do not resolve relative paths. -->
  <meta property="og:title" content="The Corridor">
  <meta property="og:description" content="You are the wolf. The map you inherited is wrong.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://the-corridor.vercel.app/">
  <meta property="og:image" content="https://the-corridor.vercel.app/og-cover.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The Corridor">
  <meta name="twitter:description" content="You are the wolf. The map you inherited is wrong.">
  <meta name="twitter:image" content="https://the-corridor.vercel.app/og-cover.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #191b16; }
    canvas { display: block; }
    /* Loading state: shown by the browser instantly (zero JS, no fetch), so the
       first impression is the title on dusk, not a black rectangle. main.js
       fades it out on the first successful draw(). */
    #loading {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #191b16;
      font-family: Georgia, "Times New Roman", serif;
      transition: opacity 0.6s ease; opacity: 1;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .wm {
      color: #d8cfb8; font-size: 34px; letter-spacing: 0.28em;
      font-weight: bold; text-indent: 0.28em;
    }
    #loading .ld {
      color: #6f6a5a; font-size: 14px; font-style: italic;
      letter-spacing: 0.1em; margin-top: 22px;
    }
  </style>
</head>
<body>
  <div id="loading"><div class="wm">THE CORRIDOR</div><div class="ld">loading…</div></div>
  <canvas id="game"></canvas>
  <script src="data.js"></script>
  <script src="game.js"></script>
  <script src="render.js"></script>
  <script src="main.js"></script>
</body>
</html>
